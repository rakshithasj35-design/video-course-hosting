services:
  - type: web
    name: coursehub-video-hosting-api
    runtime: python
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /api/database/health
    disk:
      name: coursehub-uploads
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.10
      - key: FLASK_DEBUG
        value: "false"
      - key: FRONTEND_URL
        value: https://coursehub-video-hosting-web.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: UPLOAD_ROOT
        value: /var/data/uploads
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: video_course_hosting

  - type: web
    name: coursehub-video-hosting-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://coursehub-video-hosting-api.onrender.com
